name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job declares its own permissions below
permissions: {}

# A new push to the same pull request or branch replaces the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    # Reads the workflow files and uploads the audit result to code scanning
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic

  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Builds and tests the checkout; publishes nothing
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - name: Verify committed bundle
        run: |
          if [[ -n "$(git status --porcelain -- dist/)" ]]; then
            git status --short -- dist/ >&2
            echo "dist/ differs from the source; run npm run bundle and commit the result" >&2
            exit 1
          fi
      - name: Write a smoke-test plan
        run: echo '{"format_version":"1.2","resource_changes":[]}' > smoke-plan.json
      # Runs the committed bundle the way a customer workflow does. The endpoint refuses the connection,
      # so the step reports a scan error without failing; the outputs prove the bundle loaded and ran.
      - name: Run the Action from this checkout
        id: smoke
        uses: $/
        with:
          plan-json: smoke-plan.json
          api-key: smoke-test
          api-url: https://127.0.0.1:9/ci/scans
      - name: Check the smoke-test outputs
        env:
          SCAN_STATUS: ${{ steps.smoke.outputs.scan-status }}
        run: |
          if [[ "$SCAN_STATUS" != "error" ]]; then
            echo "Expected scan-status error from the unreachable endpoint, got '$SCAN_STATUS'" >&2
            exit 1
          fi
