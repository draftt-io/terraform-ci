name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag, for example v1.0.0 or v1.1.0-rc.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: terraform-ci-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - name: Verify committed bundle
        run: |
          if [[ -n "$(git status --porcelain -- dist/)" ]]; then
            git status --short -- dist/ >&2
            echo "dist/ differs from the source; run npm run bundle and commit the result" >&2
            exit 1
          fi
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v1.0.0" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag already exists" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "package.json version $package_version does not match the release tag $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
      - name: Move the major version tag
        if: ${{ !contains(inputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          major="${RELEASE_TAG%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "$major now points at $GITHUB_SHA"
