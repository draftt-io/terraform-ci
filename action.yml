name: Draftt Terraform Policy Scan
description: Upload a scrubbed Terraform plan to Draftt CI, which scans it and publishes the result on the pull request

inputs:
  plan-json:
    description: Path to an existing Terraform or OpenTofu plan JSON file
    required: true
  api-url:
    description: The Draftt CI scans endpoint; must use HTTPS and end in /ci/scans
    required: false
    default: https://api.draftt.io/ci/scans
  api-key:
    description: Draftt access key
    required: false
  terraform-root:
    description: Root Terraform module directory; also the scan key, one check and one PR comment per root
    required: false
    default: .
  policy-ids:
    description: Optional JSON array of Draftt policy ids
    required: false
  fail-on-scan-error:
    description: Fail the Action when a reliable scan cannot complete
    required: false
    default: "false"

outputs:
  scan-status:
    description: completed, skipped, or error
  violation-count:
    description: Number of resources with policy violations
  warning-count:
    description: Number of incomplete evaluation or coverage warnings
  annotation-count:
    description: Annotations the Draftt CI App published on the check
  check-run-url:
    description: URL of the check run the Draftt CI App published, empty when none was published

runs:
  using: node24
  main: dist/index.js
