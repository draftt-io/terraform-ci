name: Draftt Terraform Policy Scan
description: Scan a scrubbed Terraform plan with Draftt and annotate policy violations

inputs:
  plan-json:
    description: Path to an existing Terraform or OpenTofu plan JSON file
    required: true
  api-url:
    description: Full Draftt Terraform scan endpoint
    required: false
    default: https://api.draftt.io/ci/scanTerraformPlan
  api-key:
    description: Draftt access key
    required: false
  github-token:
    description: "GitHub token for this Action's checks (checks:write). With the default api-url or publish-mode action (the v0.1.1 flow) it publishes the main check and is required; in server mode it publishes the fallback (Action) check and the error check on pull request events, and the main check on other events, which run the v0.1.1 flow (see README). In either mode it also publishes the skipped check for pull requests from external forks."
    required: false
    default: ${{ github.token }}
  terraform-root:
    description: Root Terraform module directory
    required: false
    default: .
  policy-ids:
    description: Optional JSON array of Draftt policy ids
    required: false
  fail-on-violations:
    description: "Deprecated and ignored: Draftt CI checks never fail on violations, in any flow; violations are reported in the check and PR comment. When set to true the Action logs a warning."
    required: false
    default: ""
  fail-on-scan-error:
    description: Fail the Action when a reliable scan cannot complete
    required: false
    default: "false"
  publish-mode:
    description: "server: on pull request events (any event whose payload carries the pull request; see README) against a /v1/scans api-url, the Draftt CI GitHub App publishes the check and PR comment; every other case, and action, keeps the v0.1.1 check; when the App does not publish, the Action posts a fallback (Action) check"
    required: false
    default: server

outputs:
  scan-status:
    description: completed, skipped, or error
  violation-count:
    description: Number of resources with clear policy violations
  warning-count:
    description: Number of incomplete evaluation or coverage warnings
  annotation-count:
    description: Annotations published by the Draftt CI App or by this Action
  check-run-url:
    description: URL of the published check run, empty when none was published
  publisher:
    description: server, action, or none

runs:
  using: node24
  main: dist/index.js
