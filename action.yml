name: Draftt Terraform Policy Scan
description: Scan a scrubbed Terraform plan with Draftt and annotate policy violations

inputs:
  plan-json:
    description: Path to an existing Terraform or OpenTofu plan JSON file
    required: true
  api-url:
    description: Full Draftt Terraform scan endpoint
    required: false
    default: https://api.draftt.io/ci/scanTerraformPlan
  api-key:
    description: Draftt access key
    required: false
  github-token:
    description: "GitHub token for this Action's checks (checks:write). With the default api-url or publish-mode action (the v0.1.1 flow) it publishes the main check and is required; in server mode it is used only for the fallback (Action) check and the error check. In either mode it also publishes the skipped check for pull requests from external forks."
    required: false
    default: ${{ github.token }}
  terraform-root:
    description: Root Terraform module directory
    required: false
    default: .
  policy-ids:
    description: Optional JSON array of Draftt policy ids
    required: false
  fail-on-violations:
    description: Fail the Action when clear policy violations are found
    required: false
    default: "false"
  fail-on-scan-error:
    description: Fail the Action when a reliable scan cannot complete
    required: false
    default: "false"
  publish-mode:
    description: "server: on pull_request events against a /v1/scans api-url, the Draftt CI GitHub App publishes the check and PR comment; every other case, and action, keeps the v0.1.1 check; when the App does not publish, the Action posts a fallback (Action) check"
    required: false
    default: server

outputs:
  scan-status:
    description: completed, skipped, or error
  violation-count:
    description: Number of resources with clear policy violations
  warning-count:
    description: Number of incomplete evaluation or coverage warnings
  annotation-count:
    description: Annotations published by the Draftt CI App or by this Action
  check-run-url:
    description: URL of the published check run, empty when none was published
  publisher:
    description: server, action, or none

runs:
  using: node24
  main: dist/index.js
