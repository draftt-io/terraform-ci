name: Draftt Terraform Policy Scan
description: Scan Terraform and OpenTofu plans against your Draftt policies; the Draftt CI GitHub App reports the result on the pull request
author: Draftt
branding:
  icon: shield
  color: purple

inputs:
  plan-json:
    description: Path to the Terraform or OpenTofu plan JSON, the output of terraform show -json
    required: true
  api-key:
    description: Draftt access key; pass it from a secret, for example secrets.DRAFTT_API_KEY
    required: true
  api-url:
    description: Draftt CI scans endpoint. Change it only when Draftt asks you to; must use HTTPS and end in /ci/scans
    required: false
    default: https://api.draftt.io/ci/scans
  terraform-root:
    description: Root module directory, relative to the workspace. Each root gets its own check and pull request comment
    required: false
    default: .
  policy-ids:
    description: JSON array of Draftt policy IDs to evaluate; omit it to use the organization's policies
    required: false
  fail-on-scan-error:
    description: Fail the step when the scan cannot complete. Policy violations never fail it
    required: false
    default: "false"

outputs:
  scan-status:
    description: completed, skipped (pull request from an external fork), or error
  violation-count:
    description: Number of resources with policy violations
  warning-count:
    description: Number of incomplete evaluation or coverage warnings
  annotation-count:
    description: Number of annotations the Draftt CI App published on the check
  check-run-url:
    description: URL of the check the Draftt CI App published; empty when none was published

runs:
  using: node24
  main: dist/index.js
